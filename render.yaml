services:
  - type: web
    name: pong-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: pong-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SOCKET_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
